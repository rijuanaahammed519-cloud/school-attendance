
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>School Attendance System</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef4f1;
  margin: 0;
  padding: 15px;
}

header {
  background: #075e45;
  color: white;
  text-align: center;
  padding: 20px 10px;
  border-radius: 12px;
}

.card {
  background: white;
  padding: 15px;
  margin-top: 15px;
  border-radius: 10px;
}

input {
  padding: 11px;
  width: 90%;
  margin: 6px 0;
  border: 1px solid #ccc;
  border-radius: 6px;
}

button {
  padding: 9px 12px;
  border: none;
  border-radius: 5px;
  color: white;
  margin: 3px;
}

.add { background: #075e45; }
.present { background: green; }
.absent { background: #d62828; }

.table-box {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 600px;
}

th {
  background: #075e45;
  color: white;
}

th, td {
  border: 1px solid #ddd;
  padding: 12px 8px;
  text-align: center;
}

tr:nth-child(even) {
  background: #f0f7f3;
}

.summary {
  display: flex;
  justify-content: space-around;
  text-align: center;
}

.summary h2 {
  color: #075e45;
}

footer {
  text-align: center;
  margin-top: 25px;
}
</style>
</head>

<body>

<header>
<h2>Rajshahi Cantonment</h2>
<h3>Public School & College</h3>
<p>STUDENT ATTENDANCE MANAGEMENT</p>
</header>

<div class="card">
<h3>Attendance Date</h3>
<input type="date" id="date">
</div>

<div class="card">
<h3>Add New Student</h3>

<input id="roll" placeholder="Roll Number">
<input id="name" placeholder="Student Name">
<input id="className" placeholder="Class">
<input id="section" placeholder="Section">

<button class="add" onclick="addStudent()">
+ Add Student
</button>
</div>

<div class="card">
<h3>Attendance Summary</h3>

<div class="summary">
<div>
<h2 id="total">0</h2>
Total
</div>

<div>
<h2 id="pCount">0</h2>
Present
</div>

<div>
<h2 id="aCount">0</h2>
Absent
</div>
</div>
</div>

<div class="card">
<h3>Student Attendance Table</h3>

<div class="table-box">
<table>
<thead>
<tr>
<th>Roll</th>
<th>Name</th>
<th>Class</th>
<th>Section</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="studentTable"></tbody>
</table>
</div>

<br>

<button class="add" onclick="saveAttendance()">
Save Attendance
</button>

</div>

<footer>
<p>© 2026 Rajshahi Cantonment Public School & College</p>
</footer>

<script>

let students = JSON.parse(
 localStorage.getItem("schoolStudents") || "[]"
);

let records = JSON.parse(
 localStorage.getItem("schoolRecords") || "{}"
);

let dateInput = document.getElementById("date");

function today() {
 let d = new Date();
 let offset = d.getTimezoneOffset();
 return new Date(d.getTime() - offset * 60000)
 .toISOString().slice(0,10);
}

dateInput.value = today();

let attendance = records[dateInput.value] || {};

function addStudent() {

 let roll = document.getElementById("roll").value.trim();
 let name = document.getElementById("name").value.trim();
 let cls = document.getElementById("className").value.trim();
 let section = document.getElementById("section").value.trim();

 if (!roll || !name) {
   alert("Roll and Name are required!");
   return;
 }

 if (students.some(s => s.roll === roll)) {
   alert("This roll number already exists!");
   return;
 }

 students.push({
   roll: roll,
   name: name,
   cls: cls,
   section: section
 });

 localStorage.setItem(
   "schoolStudents",
   JSON.stringify(students)
 );

 document.getElementById("roll").value = "";
 document.getElementById("name").value = "";
 document.getElementById("className").value = "";
 document.getElementById("section").value = "";

 showTable();
}

function mark(index, status) {
 attendance[index] = status;
 showTable();
}

function showTable() {

 let table = document.getElementById("studentTable");
 table.innerHTML = "";

 let present = 0;
 let absent = 0;

 students.forEach((student, index) => {

 let status = attendance[index] || "Not Marked";

 if (status === "Present") present++;
 if (status === "Absent") absent++;

 let tr = document.createElement("tr");

 [
   student.roll,
   student.name,
   student.cls,
   student.section,
   status
 ].forEach(value => {
   let td = document.createElement("td");
   td.textContent = value;
   tr.appendChild(td);
 });

 let action = document.createElement("td");

 let p = document.createElement("button");
 p.className = "present";
 p.textContent = "Present";
 p.onclick = () => mark(index, "Present");

 let a = document.createElement("button");
 a.className = "absent";
 a.textContent = "Absent";
 a.onclick = () => mark(index, "Absent");

 action.appendChild(p);
 action.appendChild(a);
 tr.appendChild(action);

 table.appendChild(tr);

 });

 document.getElementById("total").textContent =
 students.length;

 document.getElementById("pCount").textContent =
 present;

 document.getElementById("aCount").textContent =
 absent;
}

function saveAttendance() {

 records[dateInput.value] = attendance;

 localStorage.setItem(
   "schoolRecords",
   JSON.stringify(records)
 );

 alert("Attendance Saved Successfully!");
}

dateInput.addEventListener("change", () => {

 attendance = records[dateInput.value] || {};

 showTable();

});

showTable();

</script>

</body>
</html>
